function bytes(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return u;}
var form=document.getElementById("f"),inp=document.getElementById("p"),btn=document.getElementById("b"),err=document.getElementById("e");
async function unlock(pass){
  var subtle=(window.crypto||{}).subtle;
  if(!subtle){err.textContent="This browser can\u2019t open it \u2014 try Safari or Chrome.";return;}
  var km=await subtle.importKey("raw",new TextEncoder().encode(pass),{name:"PBKDF2"},false,["deriveKey"]);
  var key=await subtle.deriveKey({name:"PBKDF2",salt:bytes(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(CT));
  var out=new TextDecoder().decode(pt);
  try{sessionStorage.setItem("kp-open",pass);}catch(e){}
  document.open();document.write(out);document.close();
}
form.addEventListener("submit",function(ev){
  ev.preventDefault();err.textContent="";btn.disabled=true;btn.textContent="Opening\u2026";
  unlock(inp.value.trim()).catch(function(){
    err.textContent="That code didn\u2019t work \u2014 check it and try again.";
    btn.disabled=false;btn.textContent="Open";inp.select();
  });
});
inp.focus();
try{var _sp=sessionStorage.getItem("kp-open");if(_sp){btn.disabled=true;btn.textContent="Opening\u2026";unlock(_sp).catch(function(){btn.disabled=false;btn.textContent="Open";});}}catch(e){}</script>
