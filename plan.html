function bytes(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return u;}
var form=document.getElementById("f"),inp=document.getElementById("p"),btn=document.getElementById("b"),err=document.getElementById("e");
async function unlock(pass){
  var subtle=(window.crypto||{}).subtle;
  if(!subtle){err.textContent="This browser can\u2019t open it \u2014 try Safari or Chrome.";return;}
  var km=await subtle.importKey("raw",new TextEncoder().encode(pass),{name:"PBKDF2"},false,["deriveKey"]);

  var out=new TextDecoder().decode(pt);
  document.open();document.write(out);document.close();
}
